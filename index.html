        body.dark-mode {

        }

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
        }

        .server-card {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .dark-mode .server-card {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .light-mode .server-card {
            background-color: #ffffff;
            border: 11px solid #e0e0e0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .server-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 210%;
            height: 210%;
            background: conic-gradient(
                hsl(270, 100%, 60%) 0%,
                hsl(265, 100%, 55%) 5%,
                hsl(255, 100%, 50%) 10%,
                hsl(240, 100%, 50%) 20%,
                hsl(230, 100%, 55%) 25%,
                hsl(210, 100%, 60%) 35%,
                hsl(190, 100%, 55%) 40%,
                hsl(170, 100%, 50%) 50%,
                hsl(130, 100%, 55%) 55%,
                hsl(90, 100%, 50%) 65%,
                hsl(60, 100%, 55%) 70%,
                hsl(40, 100%, 55%) 80%,
                hsl(20, 100%, 50%) 85%,
                hsl(0, 100%, 50%) 95%,
                hsl(330, 100%, 60%) 98%,
                hsl(270, 100%, 60%) 100%
            );
            border-radius: 8px;
            z-index: 0;
            opacity: 0;
            filter: blur(0.2px);
            transition: opacity 0.3s ease-in-out;
            transform-origin: 50% 50%;
        }

        .server-card:hover::before,
        .server-card.clicked::before {
            opacity: 0.8;
            animation: rotateBackground 2.5s linear infinite;
        }

        @keyframes rotateBackground {
            to {
                transform: rotate(360deg);
            }
        }

        .server-card-content {
            position: relative;
            z-index: 1;
            padding: 1rem 1.5rem;
            background-color: var(--card-bg-color-dark);
            border-radius: 8px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        body.light-mode .server-card-content {
            background-color: var(--card-bg-color-light);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #2196F3;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

                #4B0082 16.66%,

        }

        .glowing-button:hover::before {
            width: 200%;
            height: 200%;
            opacity: 1;
        }

        @keyframes glowingGradient {
            0% { background-position: 0% 0%; }
            14.28% { background-position: 14.28% 0%; }

        function showMessage(message, type = 'success') {
            messageBox.textContent = message;
            if (type === 'error') {
                messageBox.style.backgroundColor = 'rgba(220, 20, 60, 0.9)';
            } else {
                messageBox.style.backgroundColor = 'rgba(50, 205, 50, 0.9)';
            }
            messageBox.classList.add('show');
            setTimeout(() => {
                messageBox.classList.remove('show');
            }, 2000);
        }

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showMessage('Copied to clipboard!');
            } catch (err) {
                console.error('Failed to copy text: ', err);
                showMessage('Failed to copy!', 'error');
            }
            document.body.removeChild(textarea);
        }

            return ((ipInt >>> 24) & 0xFF) + '.' +

            serverElements.forEach(serverEl => {
                const serverInfoEl = serverEl.querySelector('server-info');
                if (!serverInfoEl) return;

                const server = {};
                for (const attr of serverInfoEl.attributes) {
                    server[attr.name.replace(/-/g, '_')] = attr.value;
                }
                server.max_players = parseInt(server.max_players);
                server.current_players = parseInt(server.current_players);
                server.current_ai = parseInt(server.current_ai);
                server.difficulty = parseInt(server.difficulty);
                server.game_mode = parseInt(server.game_mode);
                server.distance = parseFloat(server.distance);
                server.password = server.password === '1';
                server.official = server.official === '1';
                server.game_started = server.game_started === '1';
                server.port = parseInt(server.port);

                server.players = [];
                const playerInfoElements = serverEl.querySelectorAll('player-info');
                playerInfoElements.forEach(playerEl => {
                    const p = {};
                    for (const attr of playerEl.attributes) {
                        p[attr.name.replace(/-/g, '_')] = attr.value;
                    }
                    p.rank = parseInt(p.rank);
                    p.scores = parseFloat(p.scores);
                    p.max_scores = parseFloat(p.max_scores);
                    p.num_races_done = parseInt(p.num_races_done);
                    server.players.push(p);
                });

                server.effective_human_players = server.players.length;
                
                server.effective_ai_players = Math.max(0, server.current_players - server.effective_human_players);

                servers.push(server);
            });
            return servers;
        }

        function renderServers(serversToRender) {
            serverListDiv.innerHTML = '';

            const currentSearchTerm = searchBar.value.toLowerCase();
            const currentSelectedGameMode = gameModeFilterSelect.value;
            const currentSelectedDifficulty = difficultyFilterSelect.value;
            const currentSelectedServerStatus = serverStatusFilterSelect.value;

            let filteredServers = serversToRender.filter(server => {
                const nameMatch = server.name.toLowerCase().includes(currentSearchTerm);
                const countryMatch = server.country_code.toLowerCase().includes(currentSearchTerm);
                const gameModeMatch = (gameModeMap[server.game_mode] || '').toLowerCase().includes(currentSearchTerm);
                const playerMatch = server.players.some(p => (p.username || '').toLowerCase().includes(currentSearchTerm));
                const searchMatches = nameMatch || countryMatch || gameModeMatch || playerMatch;

                const gameModeMatches = currentSelectedGameMode === "" || server.game_mode.toString() === currentSelectedGameMode;
                const difficultyMatches = currentSelectedDifficulty === "" || server.difficulty.toString() === currentSelectedDifficulty;
                const statusMatches = currentSelectedServerStatus === "" || server.game_started.toString() === currentSelectedServerStatus;

                return searchMatches && gameModeMatches && difficultyMatches && statusMatches;
            });

            let totalHumanPlayers = 0;
            let totalAIPlayers = 0;
            
            allServers.forEach(server => {
                totalHumanPlayers += server.effective_human_players;
                totalAIPlayers += server.effective_ai_players;
            });

            totalPlayersCountHumanSpan.textContent = totalHumanPlayers;
            totalPlayersCountAISpan.textContent = totalAIPlayers;


            if (filteredServers.length === 0) {
                let message = "No results found";
                const activeFilterDescriptions = [];

                if (currentSearchTerm) {
                    activeFilterDescriptions.push(`matching search term "${currentSearchTerm}"`);
                }
                if (currentSelectedGameMode !== "") {
                    activeFilterDescriptions.push(`for game mode "${gameModeMap[currentSelectedGameMode]}"`);
                }
                if (currentSelectedDifficulty !== "") {
                    activeFilterDescriptions.push(`for difficulty "${difficultyMap[currentSelectedDifficulty]}"`);
                }
                if (currentSelectedServerStatus !== "") {
                    activeFilterDescriptions.push(`with status "${serverStatusMap[currentSelectedServerStatus]}"`);
                }

                if (activeFilterDescriptions.length > 0) {
                    message += " " + activeFilterDescriptions.join(" and ");
                }
                message += ". Please adjust your filters or search term.";

                serverListDiv.innerHTML = `<p class="text-center text-gray-400 col-span-full">${message}</p>`;
                return;
            }

            filteredServers.forEach(server => {
                const card = document.createElement('div');
                card.className = `server-card p-6 rounded-xl shadow-lg flex flex-col justify-between ${clickedServerIds.has(server.id) ? 'clicked' : ''}`;
                card.dataset.serverId = server.id;

                const humanPlayers = server.effective_human_players;
                const aiPlayers = server.effective_ai_players;
                const totalPlayers = humanPlayers + aiPlayers;
                
                const playersText = humanPlayers + (aiPlayers > 0 ? ` (+${aiPlayers} AI)` : '');
                const gameModeName = gameModeMap[server.game_mode] || `Mode ${server.game_mode}`;
                const difficultyDisplay = server.difficulty !== 4 ? `<p><strong class="text-purple-400">Difficulty:</strong> ${difficultyMap[server.difficulty] || `Difficulty ${server.difficulty}`}</p>` : '';
                const formattedTrackName = formatTrackName(server.current_track);
                const ipAddress = intToIp(parseInt(server.ip));

                const isFrankfurtServer = server.name.toLowerCase().includes('frankfurt');
                const isTierSServer = server.name.toLowerCase().startsWith('tiers');
                const shouldShowIpPort = !server.password || isFrankfurtServer || isTierSServer;

                const showHiddenDetailsInitially = clickedServerIds.has(server.id);

                if (server.players && server.players.length > 0) {
                    server.players.sort((a, b) => {
                        const rankA = a.rank;
                        const rankB = b.rank;

                        if (isNaN(rankA) && !isNaN(rankB)) return -1;
                        if (!isNaN(rankA) && isNaN(rankB)) return 1;
                        return rankA - rankB;
                    });
                }

                card.innerHTML = `
                    <div class="server-card-content">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="text-xl font-semibold" title="${server.name}">${server.name}</h2>
                            ${server.official ? '<span class="text-xl ml-2" title="Official Server">👑</span>' : ''}
                        </div>
                        <div class="grid grid-cols-2 gap-y-2 text-sm">
                            <p class="flex items-center"><img src="https://flagsapi.com/${server.country_code}/flat/24.png" onerror="this.onerror=null;this.src='https://placehold.co/24x18/cccccc/333333?text=NA';" class="mr-2 rounded-sm" alt="${server.country_code} Flag" title="${countryCodeMap[server.country_code] || server.country_code}"></p>
                            <p><strong class="text-blue-400">Players:</strong> ${playersText} / ${server.max_players}</p>
                            <div class="col-span-2 player-bar-container">
                                <div class="player-bar-fill" style="width: ${(totalPlayers / server.max_players) * 100 || 0}%;"></div>
                            </div>
                            <p><strong class="text-green-400">Game Mode:</strong> ${gameModeName}</p>
                            ${difficultyDisplay}
                            ${server.password ? '<p class="col-span-2 text-orange-400 flex items-center">🔒 Private Server</p>' : ''}
                            <p><strong class="text-gray-400">Current Track:</strong> ${formattedTrackName}</p>
                            <p class="col-span-2"><strong class="text-pink-400">Status:</strong> ${server.game_started ? 'Game Started' : 'Waiting for a game'}</p>

                            ${server.players && server.players.length > 0 ? `
                                <div class="col-span-2 player-list-scroll-container mt-4">
                                    <h4 class="font-semibold mb-2 text-blue-300">Current Players:</h4>
                                    <div class="grid grid-cols-[auto_1fr_auto] text-xs text-gray-300 gap-x-2 items-center">
                                        ${server.players.map(p => `
                                            <div class="">#${p.rank || 'N/A'}</div>
                                            <div class="font-medium text-base">${p.username || 'Unknown'}</div>
                                            <div class="flex justify-end items-center">
                                                <img src="https://flagsapi.com/${p.country_code || 'XX'}/flat/16.png" onerror="this.onerror=null;this.src='https://placehold.co/16x12/cccccc/333333?text=NA';" class="rounded-sm" alt="${(p.country_code || 'XX')} Flag" title="${countryCodeMap[p.country_code] || p.country_code || 'Unknown Country'}">
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <div class="col-span-2 hidden-details-section ${showHiddenDetailsInitially ? 'show-details' : ''}">
                                ${shouldShowIpPort ? `
                                    <p class="mt-2">
                                        <strong class="text-indigo-400">IP:</strong> ${ipAddress}
                                        ${server.port ? `<span class="ml-2">Port: ${server.port}</span>` : ''}
                                        <button class="copy-button ml-2 px-2 py-1 bg-blue-600 text-white text-xs rounded-md hover:bg-blue-700 transition-colors duration-200" data-ip="${ipAddress}" data-port="${server.port}">Copy</button>
                                    </p>
                                    ${server.ipv6 ? `<p><strong class="text-indigo-400">IPv6:</strong> ${server.ipv6}</p>` : ''}
                                ` : `
                                    <p class="mt-2 text-gray-500 text-sm">IP/Port hidden for private server.</p>
                                `}
                            </div>
                        </div>
                    </div>
                `;
                serverListDiv.appendChild(card);

                card.addEventListener('click', (event) => {
                    event.stopPropagation();

                    const hiddenDetailsSection = card.querySelector('.hidden-details-section');

                    document.querySelectorAll('.server-card.clicked').forEach(openCard => {
                        if (openCard !== card) {
                            openCard.classList.remove('clicked');
                            openCard.querySelector('.hidden-details-section').classList.remove('show-details');
                            clickedServerIds.delete(openCard.dataset.serverId);
                        }
                    });

                    if (clickedServerIds.has(server.id)) {
                        clickedServerIds.delete(server.id);
                        card.classList.remove('clicked');
                        hiddenDetailsSection.classList.remove('show-details');
                    } else {
                        clickedServerIds.add(server.id);
                        card.classList.add('clicked');
                        hiddenDetailsSection.classList.add('show-details');
                    }
                });

                const copyButton = card.querySelector('.copy-button');
                if (copyButton) {
                    copyButton.addEventListener('click', (event) => {
                        event.stopPropagation();
                        const ip = event.target.dataset.ip;
                        const port = event.target.dataset.port;
                        if (ip && port) {
                            copyToClipboard(`${ip}:${port}`);
                        } else if (ip) {
                            copyToClipboard(ip);
                        }
                    });
                }
            });
        }

        async function fetchData() {
            updateStatusSpan.innerHTML = 'Updating... <span class="spinner"></span>';

            try {
                const response = await fetch(AUTO_UPDATE_FETCH_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const text = await response.text();
                allServers = parseXML(text);
                sortAndRenderServers();
                updateStatusSpan.textContent = 'Updated!';
                setTimeout(() => updateStatusSpan.textContent = '', 2000);
            } catch (error) {
                console.error("Error fetching server data (auto-update):", error);
                serverListDiv.innerHTML = `
                    <p class="text-center text-red-500 col-span-full">
                        Failed to load server list automatically. Access to the SuperTuxKart API, or the proxy is unstable.
                    </p>
                    <p class="text-center text-gray-400 text-sm col-span-full mt-2">
                        Error details: ${error.message || 'Unknown error'}
                    </p>
                `;
                updateStatusSpan.textContent = 'Update Failed!';
                setTimeout(() => updateStatusSpan.textContent = '', 5000);
            }
        }

        function sortAndRenderServers() {
            let totalHumanPlayers = 0;
            let totalAIPlayers = 0;
            
            allServers.forEach(server => {
                totalHumanPlayers += server.effective_human_players;
                totalAIPlayers += server.effective_ai_players;
            });

            totalPlayersCountHumanSpan.textContent = totalHumanPlayers;
            totalPlayersCountAISpan.textContent = totalAIPlayers;

            let serversToDisplay = [...allServers];

            const selectedGameMode = gameModeFilterSelect.value;
            if (selectedGameMode !== "") {
                serversToDisplay = serversToDisplay.filter(server =>
                    server.game_mode.toString() === selectedGameMode
                );
            }

            const selectedDifficulty = difficultyFilterSelect.value;
            if (selectedDifficulty !== "") {
                serversToDisplay = serversToDisplay.filter(server =>
                    server.difficulty.toString() === selectedDifficulty
                );
            }

            const selectedServerStatus = serverStatusFilterSelect.value;
            if (selectedServerStatus !== "") {
                serversToDisplay = serversToDisplay.filter(server =>
                    server.game_started.toString() === selectedServerStatus
                );
            }

            const searchTerm = searchBar.value.toLowerCase();
            serversToDisplay = serversToDisplay.filter(server => {
                const nameMatch = server.name.toLowerCase().includes(searchTerm);
                const countryMatch = server.country_code.toLowerCase().includes(searchTerm);
                const gameModeMatch = (gameModeMap[server.game_mode] || '').toLowerCase().includes(searchTerm);
                const playerMatch = server.players.some(p => (p.username || '').toLowerCase().includes(searchTerm));
                return nameMatch || countryMatch || gameModeMatch || playerMatch;
            });

            const activeServers = serversToDisplay.filter(server => server.current_players > 0);
            const zeroPlayersServers = serversToDisplay.filter(server => server.current_players === 0);

            activeServers.sort((a, b) => {
                if (isSoccerMode) {
                    const aIsSoccer = a.name.toLowerCase().includes('soccer') || (gameModeMap[a.game_mode] || '').toLowerCase().includes('soccer');
                    const bIsSoccer = b.name.toLowerCase().includes('soccer') || (gameModeMap[b.game_mode] || '').toLowerCase().includes('soccer');
                    if (aIsSoccer && !bIsSoccer) return -1;
                    if (!aIsSoccer && bIsSoccer) return 1;
                }

                const playerCountDiff = b.effective_human_players - a.effective_human_players;
                if (playerCountDiff !== 0) return playerCountDiff;

                if (a.password && !b.password) return 1;
                if (!a.password && b.password) return -1;

                return 0;
            });

            zeroPlayersServers.sort((a, b) => {
                if (a.password && !b.password) return 1;
                if (!a.password && b.password) return -1;

                return a.name.localeCompare(b.name);
            });

            serversToDisplay = [...activeServers, ...zeroPlayersServers];

            renderServers(serversToDisplay);
        }

        themeToggle.addEventListener('change', () => {
            if (themeToggle.checked) {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
            }
        });

        soccerServersBtn.addEventListener('click', () => {
            isSoccerMode = !isSoccerMode;
            if (isSoccerMode) {
                soccerServersBtn.classList.add('soccer-active');
            } else {
                soccerServersBtn.classList.remove('soccer-active');
            }
            sortAndRenderServers();
        });

        refreshNowBtn.addEventListener('click', () => {
            fetchData();
            clearInterval(updateInterval);
            let countdown = 14;
            updateInterval = setInterval(() => {
                countdown--;
                if (countdown <= 1) {
                    updateStatusSpan.innerHTML = 'Updating... <span class="spinner"></span>';
                }
                if (countdown <= 0) {
                    fetchData();
                    countdown = 14;
                }
            }, 1000);
        });

        searchBar.addEventListener('input', () => {
            if (searchBar.value.length > 0) {
                searchClearBtn.style.display = 'block';
            } else {
                searchClearBtn.style.display = 'none';
            }
            sortAndRenderServers();
        });

        searchClearBtn.addEventListener('click', () => {
            searchBar.value = '';
            searchClearBtn.style.display = 'none';
            sortAndRenderServers();
        });

        gameModeFilterSelect.addEventListener('change', sortAndRenderServers);
        difficultyFilterSelect.addEventListener('change', sortAndRenderServers);
        serverStatusFilterSelect.addEventListener('change', sortAndRenderServers);
        clearFiltersBtn.addEventListener('click', () => {
            gameModeFilterSelect.value = "";
            difficultyFilterSelect.value = "";
            serverStatusFilterSelect.value = "";
            searchBar.value = "";
            searchClearBtn.style.display = 'none';
            sortAndRenderServers();
        });

        function updateUTCTime() {
            const now = new Date();
            utcTimeSpan.textContent = `UTC: ${now.toUTCString().split(' ')[4]}`;
        }

        let particles = [];
        let stars = [];
        const numParticles = 70;
        const numStars = 150;
        const particleSize = 2.5;
        const particleSpeed = 0.75;

        function resizeCanvas() {
            backgroundCanvas.width = window.innerWidth;
            backgroundCanvas.height = window.innerHeight;
        }

        function createParticle() {
            return {
                x: Math.random() * backgroundCanvas.width,
                y: Math.random() * backgroundCanvas.height,
                vx: (Math.random() - 0.5) * particleSpeed,
                vy: (Math.random() - 0.5) * particleSpeed,
                alpha: Math.random() * 0.5 + 0.1,
                radius: Math.random() * particleSize + 0.5
            };
        }

        function createStar() {
            return {
                x: Math.random() * backgroundCanvas.width,
                y: Math.random() * backgroundCanvas.height,
                radius: Math.random() * 2 + 1,
                initialAlpha: Math.random() * 0.6 + 0.4,
                currentAlpha: Math.random() * 0.6 + 0.4,
                alphaDirection: Math.random() > 0.5 ? 1 : -1,
                twinkleSpeed: Math.random() * 0.015 + 0.008
            };
        }

        function initParticlesAndStars() {
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push(createParticle());
            }
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(createStar());
            }
        }

        function animateBackground() {
            ctx.clearRect(0, 0, backgroundCanvas.width, backgroundCanvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > backgroundCanvas.width || p.y < 0 || p.y > backgroundCanvas.height) {
                    Object.assign(p, createParticle());
                    if (p.x < 0) p.x = backgroundCanvas.width;
                    if (p.x > backgroundCanvas.width) p.x = 0;
                    if (p.y < 0) p.y = backgroundCanvas.height;
                    if (p.y > backgroundCanvas.height) p.y = 0;
                }
            });

            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.currentAlpha})`;
                ctx.fill();

                s.currentAlpha += s.alphaDirection * s.twinkleSpeed;

                if (s.currentAlpha > s.initialAlpha + 0.3 || s.currentAlpha < s.initialAlpha - 0.2) {
                    s.alphaDirection *= -1;
                }
            });

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            const gridSize = 50;
            for (let x = 0; x < backgroundCanvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, backgroundCanvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < backgroundCanvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(backgroundCanvas.width, y);
                ctx.stroke();
            }

            requestAnimationFrame(animateBackground);
        }

        resizeCanvas();
        initParticlesAndStars();
        animateBackground();
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticlesAndStars();
        }
    );

        populateFilters();
        fetchData();
        updateUTCTime();
        setInterval(updateUTCTime, 1000);

        let countdown = 14;
        updateInterval = setInterval(() => {
            countdown--;
            if (countdown <= 1) {
                updateStatusSpan.innerHTML = 'Updating... <span class="spinner"></span>';
            }
            if (countdown <= 0) {
                fetchData();
                countdown = 14;
                }
            }, 1000);
        </script>
    </body>
</html>
